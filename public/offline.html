<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Offline — Cancer Diagnosis</title>

  <meta name="description" content="You are offline. Please reconnect to continue." />

  <style>
    :root {
      color-scheme: light dark;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      text-align: center;
      background: #f5f5f7;
      color: #222;
    }

    @media (prefers-color-scheme: dark) {
      body {
        background: #0e0e0f;
        color: #fff;
      }
    }

    .card {
      max-width: 380px;
      padding: 2rem;
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.8);
      box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);
      backdrop-filter: blur(12px);
    }

    @media (prefers-color-scheme: dark) {
      .card {
        background: rgba(30, 30, 30, 0.6);
      }
    }

    h1 {
      font-size: 1.8rem;
      margin-bottom: 0.5rem;
    }

    p {
      font-size: 1rem;
      opacity: 0.8;
      margin-bottom: 1.5rem;
    }

    button {
      padding: 0.75rem 1.5rem;
      border: none;
      border-radius: 12px;
      font-size: 1rem;
      cursor: pointer;
      background: #0070f3;
      color: white;
      font-weight: 600;
      transition: 0.2s;
    }

    button:hover {
      opacity: 0.85;
    }

    button:active {
      transform: scale(0.97);
    }
  </style>
</head>

<body>
  <div class="card">
    <h1>You’re offline</h1>
    <p>No internet connection. Please reconnect to continue using the app.</p>
    <button onclick="window.location.reload()">Retry</button>
  </div>
</body>
</html>
